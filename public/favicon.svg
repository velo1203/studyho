<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .bg { fill: #000000; }
        .icon { fill: #ffffff; stroke: #ffffff; }
      }
      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .icon { fill: #000000; stroke: #000000; }
      }
    </style>
  </defs>
  
  <!-- 배경 -->
  <rect class="bg" width="100" height="100" rx="18"/>
  
  <!-- 책 아이콘 -->
  <g class="icon">
    <!-- 왼쪽 페이지 -->
    <path d="M 20 25 L 20 75 L 50 70 L 50 20 Z" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 오른쪽 페이지 -->
    <path d="M 50 20 L 50 70 L 80 75 L 80 25 Z" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 중앙선 -->
    <line x1="50" y1="20" x2="50" y2="70" stroke-width="3" stroke-linecap="round"/>
    
    <!-- S 글자 -->
    <text x="50" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="currentColor">S</text>
  </g>
</svg>
